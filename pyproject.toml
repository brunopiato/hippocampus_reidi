[project]
name = "hippocampus-reidi"
version = "0.1.0"
description = "Measure the percentage of selected RGB ranges in standardized images"
readme = "README.md"
authors = [
    { name = "Bruno Piato", email = "piatobio@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0,<8",
    "ipympl>=0.10.0,<0.11",
    "ipywidgets>=8.1.8,<9",
    "jupyterlab>=4.5.4,<5",
    "matplotlib>=3.10.8,<4",
    "numpy>=2.4.2,<3",
    "opencv-python>=4.13.0.92,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
